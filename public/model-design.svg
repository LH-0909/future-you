<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800"><rect width="1000" height="800" fill="#f3f5f1"/><g font-family="Microsoft YaHei,sans-serif" fill="#213b40"><text x="55" y="65" font-size="30">未来的你 · 脊柱与骨盆教学模型</text><text x="55" y="100" font-size="16">结构与装配概念图 · 非工程加工图 · 尺寸与连接公差待验证</text><text x="100" y="155" font-size="20">整体装配关系</text><text x="550" y="155" font-size="20">部件与制作建议</text></g><g stroke="#446869" stroke-width="3"><path d="M275 210L275 570" stroke-dasharray="8 6"/><g fill="#ded6b9"><rect x="232" y="210" width="86" height="40" rx="12"/><rect x="225" y="282" width="100" height="40" rx="12"/><rect x="220" y="354" width="110" height="40" rx="12"/><rect x="216" y="426" width="118" height="40" rx="12"/><rect x="210" y="498" width="130" height="40" rx="12"/><path d="M235 563H315L275 633Z"/><path d="M231 558Q127 504 150 639L239 612Z"/><path d="M319 558Q423 504 400 639L311 612Z"/></g><g fill="#86c5c0"><rect x="239" y="259" width="72" height="15" rx="6"/><rect x="233" y="331" width="84" height="15" rx="6"/><rect x="230" y="403" width="90" height="15" rx="6"/><rect x="224" y="475" width="102" height="15" rx="6"/></g><rect x="132" y="652" width="290" height="28" rx="6" fill="#446869"/><path d="M188 232Q170 415 175 555M362 232Q380 415 375 555" stroke="#ba7970" stroke-width="12" fill="none"/></g><g font-family="Microsoft YaHei,sans-serif" font-size="17" fill="#213b40"><text x="390" y="230">腰椎 × 5</text><text x="390" y="280">椎间盘 × 4</text><text x="390" y="330">侧面教学肌束</text><text x="420" y="590">骨盆与骶骨</text><text x="200" y="711">底座 + 背部定位杆</text><text x="550" y="220">① 底座：防倾倒，保留标签位置</text><text x="550" y="270">② 骨盆：左右分件，与骶骨定位连接</text><text x="550" y="320">③ 腰椎：可拆部件，自下而上编号</text><text x="550" y="370">④ 椎间盘：与骨件使用不同颜色</text><text x="550" y="420">⑤ 肌束：可拆软带，表示协作位置</text><text x="550" y="470">⑥ 定位杆：便于拆解后复原</text><text x="550" y="550">装配：底座 → 骨盆/骶骨 → 腰椎</text><text x="550" y="585">→ 插入椎间盘 → 挂教学肌束 → 标签</text><text x="550" y="655">制作前检查：材料、边缘、公差</text><text x="550" y="690">连接牢度、底座稳定性与实际教学效果</text><text x="55" y="765" font-size="14">原创简化教学示意。部件形状不替代真实解剖，不计算压力、损伤或疾病风险。</text></g></svg>